name: Release

on:
  push:
    tags:
      - "v*"

env:
  APP_TAG: ""
  APP_VERSION: ""
  WAILS3_VERSION: "v3.1.0"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $version = $tag.TrimStart("v")

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag. Expected vX.Y.Z"
          }

          echo "APP_TAG=$tag" >> $env:GITHUB_ENV
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        shell: pwsh
        run: |
          # v3.1.0 CLI (the v2 CLI cannot build a v3 project)
          # NOTE: quote the module@version argument; unquoted @$env:... risks being
          # parsed as a PowerShell splat instead of a string expansion.
          $ver = $env:WAILS3_VERSION
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$ver"
          if ($LASTEXITCODE -ne 0) { throw "go install wails3 failed" }

          $gobin = Join-Path (go env GOPATH) "bin"
          echo "$gobin" >> $env:GITHUB_PATH
          echo "WAILS_BIN=$gobin" >> $env:GITHUB_ENV

          & (Join-Path $gobin "wails3.exe") version

      - name: Install Inno Setup and 7-Zip
        shell: pwsh
        run: |
          choco install innosetup 7zip -y
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      - name: Patch version files
        shell: pwsh
        run: |
          # 同步 build/config.yml / core/version/version.go / build/windows/info.json /
          # wails.exe.manifest / package.iss / frontend/package.json
          ./scripts/set_version.ps1 -Version ${env:APP_VERSION}

      - name: Fetch runtime assets
        shell: pwsh
        run: |
          .\scripts\fetch_runtime_assets.ps1

      - name: Generate v3 bindings
        shell: pwsh
        run: |
          # frontend/bindings/goclashz (also regenerated as a build:frontend dependency,
          # this step makes a failure obvious before the long build)
          wails3 generate bindings -d frontend/bindings -ts
          if ($LASTEXITCODE -ne 0) { throw "wails3 generate bindings failed" }
          if (!(Test-Path "frontend/bindings")) { throw "frontend/bindings was not generated" }

      - name: Build Wails app
        shell: pwsh
        run: |
          # wails3 build -> Taskfile: bindings -> frontend build -> go build -> bin/GoclashZ.exe
          wails3 build
          if ($LASTEXITCODE -ne 0) { throw "wails3 build failed" }

      - name: Build Helper service
        shell: pwsh
        run: |
          go build -ldflags "-s -w" -o bin/GoclashZHelper.exe ./cmd/goclashz-helper/
          if ($LASTEXITCODE -ne 0) { throw "helper build failed" }

      - name: Validate build outputs
        shell: pwsh
        run: |
          $exe = "bin/GoclashZ.exe"
          if (!(Test-Path $exe)) { throw "Missing build output: $exe" }
          if (!(Test-Path "bin/GoclashZHelper.exe")) { throw "Missing build output: bin/GoclashZHelper.exe" }

          $vi = (Get-Item $exe).VersionInfo
          "FileVersion   = $($vi.FileVersion)"
          "ProductVersion= $($vi.ProductVersion)"
          "ProductName   = $($vi.ProductName)"
          "CompanyName   = $($vi.CompanyName)"

          if ($vi.ProductVersion -notlike "${env:APP_VERSION}*") {
            throw "ProductVersion '$($vi.ProductVersion)' does not match release version '${env:APP_VERSION}'"
          }
          if ($vi.ProductName -ne "GoclashZ") {
            throw "ProductName '$($vi.ProductName)' is not GoclashZ"
          }

      - name: Validate core files
        shell: pwsh
        run: |
          .\scripts\validate_assets.ps1 -AssetRoot .\build\runtime-assets\core\bin

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($null -eq $cmd) { throw "ISCC.exe not found" }
            $iscc = $cmd.Source
          }
          & $iscc "/DMyAppVersion=${env:APP_VERSION}" "package.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Prepare portable directory
        shell: pwsh
        run: |
          $root = "build/portable/GoclashZ"
          New-Item -ItemType Directory -Force "$root/seed/core/bin" | Out-Null
          New-Item -ItemType File -Force "$root/.portable" | Out-Null

          Copy-Item "bin/GoclashZ.exe" "$root/GoclashZ.exe" -Force
          Copy-Item "bin/GoclashZHelper.exe" "$root/GoclashZHelper.exe" -Force
          Copy-Item "build/runtime-assets/core/bin/*" "$root/seed/core/bin" -Recurse -Force
          if (Test-Path "build/runtime-assets/core/asset-manifest.json") {
            Copy-Item "build/runtime-assets/core/asset-manifest.json" "$root/seed/core/asset-manifest.json" -Force
          }

      - name: Pack portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "build/portable/GoclashZ/*" -DestinationPath "build/GoclashZ_Portable.zip" -Force

      - name: Pack portable 7z
        shell: pwsh
        run: |
          7z a -t7z "build/GoclashZ_Portable.7z" "build/portable/GoclashZ\*" -mx=9

      - name: Move installer
        shell: pwsh
        run: |
          $src = "build/installer/GoclashZ_win_amd64_Setup.exe"
          $dst = "build/GoclashZ_win_amd64_Setup.exe"

          if (!(Test-Path $src)) {
            throw "Installer not found: $src"
          }

          Copy-Item $src $dst -Force

      - name: Generate release notes
        shell: pwsh
        run: |
          $tag = "${env:APP_TAG}"

          if (!(Test-Path "CHANGELOG.md")) {
            throw "CHANGELOG.md not found"
          }

          $content = Get-Content "CHANGELOG.md" -Raw
          $pattern = "(?ms)^##\s+$tag\s*(.*?)(?=^##\s+v|\z)"
          $match = [regex]::Match($content, $pattern)

          if (!$match.Success) {
            throw "No changelog section found for $tag"
          }

          $changes = $match.Groups[1].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($changes)) {
            $changes = "1. "
          }

          $notes = @"
          # 正式版 $tag

          GoclashZ $tag 登场。

          ## 更新内容

          $tag 更新说明：

          $changes

          ## 安装与运行须知
          1. 从 Releases 页面下载最新版本的 GoclashZ 安装包。
          2. 常规模式双击即可运行。TUN 模式需要安装后台服务 (GoclashZHelper)，可在设置页面一键安装。
          3. 便携包解压即用，点击主程序即可使用。
          4. 如果有缺失运行环境，请前往 [Microsoft Edge WebView2 下载页面](https://developer.microsoft.com/en-us/microsoft-edge/webview2?form=MA13LH)

          GoclashZ - 追求极致性能与极简体验。
          "@

          $notes = $notes -replace "(?m)^[ \t]+", ""
          Set-Content "build/release_notes.md" $notes -Encoding UTF8

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: GoclashZ ${{ env.APP_TAG }}
          tag_name: ${{ env.APP_TAG }}
          body_path: build/release_notes.md
          files: |
            build/GoclashZ_win_amd64_Setup.exe
            build/GoclashZ_Portable.zip
            build/GoclashZ_Portable.7z
